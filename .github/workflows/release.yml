name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose container image should be published
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: github.event_name == 'push'
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable

      - run: rustup target add ${{ matrix.target }}

      - name: install musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # Archives are named without a version so that
      # releases/latest/download/<archive> is a stable URL for install.sh.
      - name: package
        if: runner.os != 'Windows'
        run: |
          tar -C target/${{ matrix.target }}/release -czf tinycd-${{ matrix.target }}.tar.gz tinycd
          shasum -a 256 tinycd-${{ matrix.target }}.tar.gz > tinycd-${{ matrix.target }}.tar.gz.sha256

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/tinycd.exe -DestinationPath tinycd-${{ matrix.target }}.zip
          $hash = (Get-FileHash tinycd-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  tinycd-${{ matrix.target }}.zip" | Out-File -Encoding ascii tinycd-${{ matrix.target }}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: tinycd-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: tinycd-*
          generate_release_notes: true

  image:
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: download verified release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          mkdir -p dist/archives dist/amd64 dist/arm64
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'tinycd-*-unknown-linux-musl.tar.gz*' --dir dist/archives
          (cd dist/archives && shasum -a 256 --check ./*.sha256)
          tar -xzf dist/archives/tinycd-x86_64-unknown-linux-musl.tar.gz -C dist/amd64
          tar -xzf dist/archives/tinycd-aarch64-unknown-linux-musl.tar.gz -C dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BINARY_SOURCE=release
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
      - name: verify published container binaries
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG" --version |
              grep --fixed-strings --line-regexp "tinycd ${RELEASE_TAG#v}"
          done
