name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add ${{ matrix.target }}

      - name: install musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # Archives are named without a version so that
      # releases/latest/download/<archive> is a stable URL for install.sh.
      - name: package
        if: runner.os != 'Windows'
        run: |
          tar -C target/${{ matrix.target }}/release -czf tinycd-${{ matrix.target }}.tar.gz tinycd
          shasum -a 256 tinycd-${{ matrix.target }}.tar.gz > tinycd-${{ matrix.target }}.tar.gz.sha256

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/tinycd.exe -DestinationPath tinycd-${{ matrix.target }}.zip
          $hash = (Get-FileHash tinycd-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  tinycd-${{ matrix.target }}.zip" | Out-File -Encoding ascii tinycd-${{ matrix.target }}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: tinycd-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: tinycd-*
          generate_release_notes: true
