name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked
      - name: process deployments and TLS hosts
        if: runner.os == 'macOS'
        run: python3 tests/smoke.py
      - name: process, container, and TLS host deployments
        if: runner.os == 'Linux'
        run: python3 tests/smoke.py --oci
      - name: container packaging
        if: runner.os == 'Linux'
        run: |
          docker compose -f packaging/docker/compose.yml config --quiet
          docker build -f packaging/docker/Dockerfile -t tinycd:check .
          docker run --rm tinycd:check --version
