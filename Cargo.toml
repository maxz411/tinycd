[package]
name = "tinycd"
version = "0.5.0"
edition = "2024"
description = "Tiny self-hosted deployments: a dashboard, hosts that run releases as processes or containers, and a GitHub App"
license = "Apache-2.0"
repository = "https://github.com/maxz411/tinycd"
readme = "README.md"
keywords = ["deployment", "cd", "git", "webhook", "devops"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
strip = true
lto = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio", "ws"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
ratatui = "0.29"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "__rustls-tls", "rustls-tls-webpki-roots"] }
toml = "1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
junction = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
