[package]
name = "tinycd"
version = "0.5.0"
edition = "2024"
description = "Tiny polling and webhook based deployments"
license = "Apache-2.0"
repository = "https://github.com/maxz411/tinycd"
readme = "README.md"
keywords = ["deployment", "cd", "git", "webhook", "devops"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
strip = true
lto = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
junction = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
